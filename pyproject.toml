[project]
name = "ai-agents"
version = "0.1.0"
description = "Multi-agent AI system: Retriever + Executor"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.49.0",
    "opensearch-py>=3.1.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "structlog>=25.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
