[project]
name = "linkedin-job-agents"
version = "0.1.0"
description = "Multi-agent LinkedIn job search system"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.0,<2",
    "langchain-anthropic>=1.7.5",
    "langgraph>=1.2.13",
    "playwright>=1.40.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "rich>=13.0.0",
    "structlog>=25.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
